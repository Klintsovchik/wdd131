<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Arial, sans-serif" font-size="16">
  <rect width="1000" height="700" fill="#ffffff"/>

  <g fill="none" stroke="#2b2118" stroke-width="2">
    <!-- header -->
    <rect x="10" y="10" width="980" height="70"/>
    <circle cx="50" cy="45" r="25"/>
    <rect x="560" y="30" width="90" height="30"/>
    <rect x="665" y="30" width="90" height="30"/>
    <rect x="770" y="30" width="90" height="30"/>
    <rect x="875" y="30" width="95" height="30"/>

    <!-- hero -->
    <rect x="10" y="90" width="980" height="190"/>
    <path d="M10 90 L990 280 M990 90 L10 280" stroke="#b8923f" stroke-width="1"/>

    <!-- intro -->
    <rect x="10" y="290" width="980" height="60"/>

    <!-- card grid 4 columns -->
    <rect x="10" y="360" width="235" height="150"/>
    <rect x="258" y="360" width="235" height="150"/>
    <rect x="506" y="360" width="235" height="150"/>
    <rect x="755" y="360" width="235" height="150"/>
    <g stroke="#b8923f" stroke-width="1">
      <path d="M25 370 L230 450 M230 370 L25 450"/>
      <path d="M273 370 L478 450 M478 370 L273 450"/>
      <path d="M521 370 L726 450 M726 370 L521 450"/>
      <path d="M770 370 L975 450 M975 370 L770 450"/>
    </g>
    <rect x="25" y="370" width="205" height="80"/>
    <rect x="273" y="370" width="205" height="80"/>
    <rect x="521" y="370" width="205" height="80"/>
    <rect x="770" y="370" width="205" height="80"/>

    <!-- featured + map -->
    <rect x="10" y="520" width="580" height="100"/>
    <rect x="600" y="520" width="390" height="100"/>

    <!-- footer -->
    <rect x="10" y="630" width="980" height="60" fill="#eeeeee"/>
  </g>

  <g fill="#2b2118" text-anchor="middle">
    <text x="50" y="50" font-size="12">Logo</text>
    <text x="190" y="52" font-weight="bold" font-size="20">The Twelve</text>
    <text x="605" y="50" font-size="13">Home</text>
    <text x="710" y="50" font-size="13">Apostles</text>
    <text x="815" y="50" font-size="13">Places</text>
    <text x="922" y="50" font-size="13">Share</text>
    <text x="500" y="190" font-weight="bold" font-size="22" fill="#7b2d26">Hero image + page title</text>
    <text x="500" y="325">Introduction paragraph: Who were the Twelve?</text>
    <text x="127" y="478">Apostle card</text>
    <text x="127" y="498" font-size="12">name, bio, &quot;Read story&quot;</text>
    <text x="375" y="478">Apostle card</text>
    <text x="375" y="498" font-size="12">name, bio, &quot;Read story&quot;</text>
    <text x="623" y="478">Apostle card</text>
    <text x="623" y="498" font-size="12">name, bio, &quot;Read story&quot;</text>
    <text x="872" y="478">Apostle card</text>
    <text x="872" y="498" font-size="12">(4 columns x 3 rows)</text>
    <text x="300" y="575">Featured story / fact of the day</text>
    <text x="795" y="575">Map of ministry places</text>
    <text x="500" y="665">Footer: &#169; year, author, last modified</text>
  </g>
</svg>
