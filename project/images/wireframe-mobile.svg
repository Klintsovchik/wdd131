<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740" font-family="Arial, sans-serif" font-size="13">
  <rect width="360" height="740" fill="#ffffff"/>

  <g fill="none" stroke="#2b2118" stroke-width="2">
    <!-- header -->
    <rect x="10" y="10" width="340" height="60"/>
    <circle cx="42" cy="40" r="20"/>
    <rect x="300" y="25" width="36" height="30"/>
    <path d="M308 33 h20 M308 40 h20 M308 47 h20"/>

    <!-- hero -->
    <rect x="10" y="80" width="340" height="170"/>
    <path d="M10 80 L350 250 M350 80 L10 250" stroke="#b8923f" stroke-width="1"/>

    <!-- intro -->
    <rect x="10" y="260" width="340" height="70"/>

    <!-- cards -->
    <rect x="10" y="340" width="340" height="110"/>
    <rect x="20" y="350" width="90" height="90"/>
    <path d="M20 350 L110 440 M110 350 L20 440" stroke="#b8923f" stroke-width="1"/>
    <rect x="10" y="460" width="340" height="110"/>
    <rect x="20" y="470" width="90" height="90"/>
    <path d="M20 470 L110 560 M110 470 L20 560" stroke="#b8923f" stroke-width="1"/>

    <!-- featured story -->
    <rect x="10" y="580" width="340" height="80"/>

    <!-- footer -->
    <rect x="10" y="670" width="340" height="60" fill="#eeeeee"/>
  </g>

  <g fill="#2b2118" text-anchor="middle">
    <text x="42" y="44" font-size="10">Logo</text>
    <text x="165" y="45" font-weight="bold">The Twelve</text>
    <text x="180" y="160" font-weight="bold" font-size="15" fill="#7b2d26">Hero image + page title</text>
    <text x="180" y="290">Introduction paragraph</text>
    <text x="180" y="308" font-size="11">Who were the Twelve?</text>
    <text x="230" y="390">Apostle card</text>
    <text x="230" y="408" font-size="11">name, short bio, &quot;Read story&quot;</text>
    <text x="230" y="510">Apostle card</text>
    <text x="230" y="528" font-size="11">(cards stack in 1 column)</text>
    <text x="180" y="615">Featured story / fact of the day</text>
    <text x="180" y="705">Footer: &#169; year, author, last modified</text>
  </g>
</svg>
