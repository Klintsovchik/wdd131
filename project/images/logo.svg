<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="pencil">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8"/>
    </filter>
  </defs>

  <g filter="url(#pencil)" fill="none" stroke="#2b2118" stroke-linecap="round" stroke-linejoin="round">
    <!-- double sketchy circle -->
    <circle cx="50" cy="50" r="46" stroke-width="1.6"/>
    <circle cx="50.6" cy="49.5" r="45.4" stroke-width="0.7" opacity="0.6"/>

    <!-- fish (ichthys) -->
    <path d="M20 60 Q47 28 76 50" stroke="#7b2d26" stroke-width="3"/>
    <path d="M20 40 Q47 72 76 50" stroke="#7b2d26" stroke-width="3"/>
    <path d="M21 59 Q48 30 75 51" stroke="#7b2d26" stroke-width="1" opacity="0.6"/>
    <circle cx="64" cy="47" r="1.8" fill="#2b2118"/>
  </g>

  <!-- twelve dots: the Twelve -->
  <g fill="#b8923f" stroke="#2b2118" stroke-width="0.6">
    <circle cx="87" cy="50" r="3"/>
    <circle cx="82" cy="68.5" r="3"/>
    <circle cx="68.5" cy="82" r="3"/>
    <circle cx="50" cy="87" r="3"/>
    <circle cx="31.5" cy="82" r="3"/>
    <circle cx="18" cy="68.5" r="3"/>
    <circle cx="13" cy="50" r="3"/>
    <circle cx="18" cy="31.5" r="3"/>
    <circle cx="31.5" cy="18" r="3"/>
    <circle cx="50" cy="13" r="3"/>
    <circle cx="68.5" cy="18" r="3"/>
    <circle cx="82" cy="31.5" r="3"/>
  </g>
</svg>
