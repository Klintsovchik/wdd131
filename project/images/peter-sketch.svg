<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <filter id="pencil">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>

    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#4a4a4a" stroke-width="0.9"/>
    </pattern>

    <pattern id="cross-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#4a4a4a" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="300" height="360" fill="#fbf8f1"/>

  <g filter="url(#pencil)" stroke-linecap="round" stroke-linejoin="round">

    <!-- soft background shading -->
    <circle cx="150" cy="150" r="118" fill="url(#hatch)" opacity="0.18"/>

    <!-- shadows -->
    <path d="M112 120 Q108 165 125 195 Q138 208 150 212 L146 160 Q130 150 118 120Z" fill="url(#cross-hatch)" opacity="0.55"/>
    <path d="M60 272 Q40 300 36 360 L110 360 Q100 300 80 262Z" fill="url(#hatch)" opacity="0.5"/>
    <path d="M150 238 Q170 290 175 360 L264 360 Q260 300 240 270 Q215 285 150 238Z" fill="url(#cross-hatch)" opacity="0.25"/>

    <g fill="none" stroke="#2f2f2f">

      <!-- face -->
      <path d="M110 120 Q108 70 150 68 Q192 70 190 120 Q192 165 175 195 Q150 215 125 195 Q108 165 110 120Z" stroke-width="2"/>
      <path d="M111 122 Q110 74 151 70 Q190 73 189 121" stroke-width="0.8" opacity="0.6"/>

      <!-- ears -->
      <path d="M110 125 Q98 128 102 145 Q105 156 112 155" stroke-width="1.6"/>
      <path d="M190 125 Q202 128 198 145 Q195 156 188 155" stroke-width="1.6"/>

      <!-- curly hair -->
      <path d="M106 118 Q98 90 112 74 Q108 62 124 60 Q130 48 146 52 Q158 44 170 54 Q186 52 188 66 Q202 76 196 96 Q200 108 194 118" stroke-width="2.2"/>
      <path d="M118 84 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0" stroke-width="1.3"/>
      <path d="M124 70 q5 -6 10 0 q5 -6 10 0 q5 -6 10 0 q5 -6 10 0" stroke-width="1.1" opacity="0.7"/>

      <!-- brows, eyes -->
      <path d="M124 118 Q135 111 145 117" stroke-width="2.4"/>
      <path d="M155 117 Q165 111 176 118" stroke-width="2.4"/>
      <path d="M127 130 Q135 124 143 130 Q135 134 127 130" stroke-width="1.5"/>
      <path d="M157 130 Q165 124 173 130 Q165 134 157 130" stroke-width="1.5"/>
      <circle cx="135" cy="129.5" r="2.3" fill="#2f2f2f"/>
      <circle cx="165" cy="129.5" r="2.3" fill="#2f2f2f"/>
      <path d="M128 138 Q135 141 142 138" stroke-width="0.8" opacity="0.6"/>
      <path d="M158 138 Q165 141 172 138" stroke-width="0.8" opacity="0.6"/>

      <!-- forehead lines -->
      <path d="M130 100 Q150 95 170 100" stroke-width="0.8" opacity="0.5"/>
      <path d="M134 106 Q150 102 166 106" stroke-width="0.8" opacity="0.5"/>

      <!-- nose -->
      <path d="M149 132 Q147 148 142 160 Q150 166 158 160" stroke-width="1.8"/>

      <!-- beard and mustache -->
      <path d="M112 150 Q108 205 150 240 Q192 205 188 150" stroke-width="2.2"/>
      <path d="M112 150 Q108 205 150 240 Q192 205 188 150 Q182 172 170 176 Q150 168 130 176 Q118 172 112 150Z" fill="url(#hatch)" stroke="none" opacity="0.7"/>
      <path d="M128 178 Q140 170 150 174 Q160 170 172 178" stroke-width="2"/>
      <path d="M141 186 Q150 189 159 186" stroke-width="1.5"/>
      <path d="M120 175 q4 10 0 20 M128 196 q4 10 0 20 M140 206 q3 10 0 20 M160 206 q-3 10 0 20 M172 196 q-4 10 0 20 M180 175 q-4 10 0 20" stroke-width="1.1" opacity="0.8"/>
      <path d="M150 196 L150 232" stroke-width="0.9" opacity="0.6"/>

      <!-- robe -->
      <path d="M122 222 Q90 240 60 270 Q40 300 36 360" stroke-width="2.2"/>
      <path d="M178 222 Q210 240 240 270 Q260 300 264 360" stroke-width="2.2"/>
      <path d="M60 272 Q150 322 248 264" stroke-width="2"/>
      <path d="M150 240 L130 360" stroke-width="1.4"/>
      <path d="M150 240 Q170 290 175 360" stroke-width="1.4"/>
      <path d="M88 290 Q96 320 92 360 M212 290 Q205 320 212 360" stroke-width="1" opacity="0.7"/>
    </g>

    <!-- keys, symbol of Peter -->
    <g fill="none" stroke="#7b2d26" stroke-width="2.4">
      <circle cx="206" cy="304" r="10"/>
      <path d="M214 312 L246 346 M236 336 l8 -6 M242 342 l8 -6"/>
      <circle cx="226" cy="300" r="9" opacity="0.85"/>
      <path d="M232 308 L256 340 M248 330 l8 -5 M253 336 l7 -5" opacity="0.85"/>
    </g>
  </g>

  <text x="18" y="30" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#2f2f2f">Peter</text>
</svg>
