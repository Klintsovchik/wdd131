<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Review | WDD 131 | Dynamic Web Fundamentals | Timofey Klintsov</title>

  <meta
    name="description"
    content="Product review form - rate a product, choose useful features and write a short review."
  >

  <meta name="author" content="Timofey Klintsov">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/form.css">

  <script src="scripts/form.js" defer></script>
</head>

<body>

  <header>
    <h1>Product Review</h1>
  </header>


  <main>

    <form action="review.html" method="get">

      <label for="product">Product Name</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>


      <fieldset class="rating">
        <legend>Overall Rating</legend>

        <label for="rating1">
          <span aria-hidden="true">&star;</span>
          <input type="radio" id="rating1" name="rating" value="1" required>
          <span class="sr-only">1 star</span>
        </label>

        <label for="rating2">
          <span aria-hidden="true">&star;&star;</span>
          <input type="radio" id="rating2" name="rating" value="2" required>
          <span class="sr-only">2 stars</span>
        </label>

        <label for="rating3">
          <span aria-hidden="true">&star;&star;&star;</span>
          <input type="radio" id="rating3" name="rating" value="3" required>
          <span class="sr-only">3 stars</span>
        </label>

        <label for="rating4">
          <span aria-hidden="true">&star;&star;&star;&star;</span>
          <input type="radio" id="rating4" name="rating" value="4" required>
          <span class="sr-only">4 stars</span>
        </label>

        <label for="rating5">
          <span aria-hidden="true">&star;&star;&star;&star;&star;</span>
          <input type="radio" id="rating5" name="rating" value="5" required>
          <span class="sr-only">5 stars</span>
        </label>
      </fieldset>


      <label for="installDate">Date of Installation</label>
      <input type="date" id="installDate" name="installDate" required>


      <fieldset class="features">
        <legend>
          Which features did you find useful in the product?
          <em>(Check all that apply)</em>
        </legend>

        <label for="durability">
          <input type="checkbox" id="durability" name="features" value="durability">
          Durability
        </label>

        <label for="easeOfUse">
          <input type="checkbox" id="easeOfUse" name="features" value="ease-of-use">
          Ease of Use
        </label>

        <label for="performance">
          <input type="checkbox" id="performance" name="features" value="performance">
          Performance
        </label>

        <label for="design">
          <input type="checkbox" id="design" name="features" value="design">
          Design
        </label>
      </fieldset>


      <label for="review">Written Review <span class="optional">(Optional)</span></label>
      <textarea id="review" name="review" rows="6"></textarea>


      <label for="userName">Your Name <span class="optional">(Optional)</span></label>
      <input type="text" id="userName" name="userName" autocomplete="name">


      <input type="submit" value="Post Review">

    </form>

  </main>


  <footer>

    <p>
      &copy;<span id="currentyear"></span>
      &#127956;&#65039; Timofey Klintsov &#127956;&#65039; Batumi, Georgia
    </p>

    <p id="lastModified"></p>

  </footer>

</body>

</html>
